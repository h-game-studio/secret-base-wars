<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>秘密基地大戦 Ver.0.2</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(at top,#284262,#090f1b 75%);color:#edf5ff;font-family:system-ui,sans-serif}main{max-width:720px;margin:auto;padding:16px}h1{margin:5px 0;font-size:32px;text-shadow:0 2px 15px #458bd2}small,p{color:#bbcee2}.card{background:#16243b;border:1px solid #435e80;border-radius:14px;padding:14px;margin:13px 0}button{background:#2b4567;border:1px solid #688ab2;border-radius:9px;color:white;padding:12px 8px;font:inherit;cursor:pointer}button.active{background:#1976b3;border:2px solid #9ddfff}button:disabled{opacity:.35}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{padding:8px;background:#0c1b30;border-radius:7px}.map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#0b1728;padding:10px;border:2px solid #526b84;border-radius:10px}.room{min-height:105px;background:linear-gradient(#304c6c,#15253c);border-bottom:6px solid #728297;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}.room.sel{outline:3px solid #ffca62}.room b{font-size:33px}.room small{font-size:12px}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.bar{height:10px;background:#081221;border-radius:9px;overflow:hidden}.bar div{height:100%;background:#36d18c}.fighters{display:grid;grid-template-columns:1fr 30px 1fr;text-align:center;align-items:center;gap:7px}.fighter{font-size:52px}.log{background:#0a192b;padding:12px;border-radius:8px;min-height:60px}.hidden{display:none}.accent{background:linear-gradient(110deg,#bd3f3f,#d68b2d);border-color:#ffb970;font-weight:bold}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}</style><main><small>TACTICAL BASE × TOKUSATSU BATTLE</small><h1>⚔️ 秘密基地大戦</h1><small>Ver.0.2 操作できる試作版｜建設・防衛・攻略</small><section class="card"><b>① 陣営を選ぶ</b><div class="pair"><button id="hero" onclick="factionSet('hero')">🦸 ヒーロー</button><button id="evil" onclick="factionSet('evil')">👾 悪の組織</button></div><p id="factionText"></p></section><section class="card"><b>② 作戦を選ぶ</b><div class="pair"><button id="defend" onclick="modeSet('defend')">🏗️ 作って守る</button><button id="attack" onclick="modeSet('attack')">⚔️ 攻め込む</button></div><div class="stats"><span>💰 <b id="money"></b></span><span>🛡️ 防衛力 <b id="power"></b></span><span>🏆 勝利 <b id="wins"></b></span></div></section><section class="card"><div class="row"><b id="mapTitle"></b><small id="mapSub"></small></div><p id="help"></p><div id="map" class="map"></div><div id="builder"><p>空き区画をタップして部屋を建設。建設済みの部屋は強化できます。</p><div id="tools" class="tools"></div><div class="pair"><button onclick="earn()">💰 資金調達 +40</button><button class="accent" onclick="start('defend')">🚨 防衛戦開始</button></div></div><div id="attacker" class="hidden"><p>入口から侵入し、敵部隊を突破して司令室を制圧しよう！</p><button class="accent" style="width:100%" onclick="start('attack')">🚀 敵基地に突入</button></div></section><section class="card hidden" id="battle"><div class="row"><b id="battleTitle"></b><small id="stage"></small></div><div class="fighters"><div><div id="allyIcon" class="fighter"></div><b id="allyName"></b><div class="bar"><div id="allyBar"></div></div><small id="allyHP"></small></div><b>VS</b><div><div id="foeIcon" class="fighter"></div><b id="foeName"></b><div class="bar"><div id="foeBar"></div></div><small id="foeHP"></small></div></div><p class="log" id="log"></p><div id="actions" class="pair"><button onclick="act('hit')">⚔️ 攻撃</button><button onclick="act('skill')">✨ 必殺技（HP-12）</button><button onclick="act('guard')">🛡️ 防御・回復</button><button onclick="end()">🏳️ 撤退</button></div><button id="next" class="accent hidden" style="width:100%" onclick="advance()">次の戦闘へ ➜</button></section><small>※Ver.0.1には影響しない独立した試作版です。対人戦や専用イラストは今後の開発対象です。</small></main><script>
const $=x=>document.getElementById(x),D={hero:[['🚪','入口',0],['📡','監視室',25],['🛡️','防衛室',30],['🤖','格納庫',45],['🏋️','訓練室',25],['🖥️','司令室',0]],evil:[['🚪','入口',0],['🪤','罠室',25],['👾','怪人室',30],['🧪','研究室',35],['💀','幹部室',45],['🖥️','司令室',0]]};let faction='evil',mode='defend',money=130,wins=0,rooms=[],selected=1,b=null;function init(){rooms=[{t:0,l:1},null,null,null,null,null,null,null,{t:5,l:1}]};function factionSet(f){faction=f;money=130;wins=0;selected=1;init();end();render()}function modeSet(m){mode=m;end();render()}function earn(){money+=40;render()};function render(){for(const x of ['hero','evil','defend','attack'])$(x).classList.toggle('active',x===faction||x===mode);$('factionText').textContent=faction==='hero'?'正義の基地を守り、悪の秘密基地を攻略！':'悪の基地を守り、ヒーロー本部を襲撃！';$('money').textContent=money;$('wins').textContent=wins;$('power').textContent=rooms.reduce((s,r)=>s+(r?r.l*(r.t===0?0:r.t===5?8:12):0),0);$('mapTitle').textContent=mode==='defend'?'③ あなたの基地':'③ 敵の基地';let side=mode==='defend'?faction:faction==='hero'?'evil':'hero';$('mapSub').textContent=side==='hero'?'ヒーロー本部':'悪の秘密基地';$('help').textContent=mode==='defend'?'部屋を配置して敵の襲撃に備えよう！':'敵基地を偵察して突入しよう！';$('builder').classList.toggle('hidden',mode!=='defend');$('attacker').classList.toggle('hidden',mode!=='attack');$('map').innerHTML='';for(let i=0;i<9;i++){let r=mode==='defend'?rooms[i]:{t:[0,1,2,3,4,2,3,4,5][i],l:i>4?2:1},el=document.createElement('button');el.className='room'+(mode==='defend'&&selected===i?' sel':'');el.innerHTML=r?`<small>${i===0?'入口':i===8?'最深部':`区画 ${i+1}`} / Lv.${r.l}</small><b>${D[side][r.t][0]}</b><small>${D[side][r.t][1]}</small>`:'<b>＋</b><small>空き区画</small>';el.onclick=()=>{if(mode==='defend'){selected=i;render()}};$('map').appendChild(el)}$('tools').innerHTML='';for(let i=1;i<=4;i++){let [e,n,c]=D[faction][i],r=rooms[selected],price=r?35*r.l:c,el=document.createElement('button');el.textContent=r&&r.t===i?`${e} ${n} 強化 💰${price}`:`${e} ${n} 💰${c}`;el.disabled=selected===0||selected===8||(r&&r.t!==i)||money<price;el.onclick=()=>{money-=price;if(r)r.l++;else rooms[selected]={t:i,l:1};render()};$('tools').appendChild(el)}}
function start(type){b={type,index:0,ally:100,count:type==='attack'?5:3,foe:0};$('battle').classList.remove('hidden');load();$('battle').scrollIntoView({behavior:'smooth'})}function load(){let atk=b.type==='attack',r=atk?{l:b.index>2?2:1}:rooms[b.index+1];b.foe=r?34+r.l*13:27;b.max=b.foe;$('battleTitle').textContent=atk?'⚔️ 基地攻略戦':'🚨 基地防衛戦';$('allyIcon').textContent=atk?(faction==='hero'?'🦸':'👾'):(faction==='hero'?'🦸':'💀');$('foeIcon').textContent=atk?(faction==='hero'?'👾':'🦸'):(faction==='hero'?'👾':'🦸');$('allyName').textContent=atk?'突入部隊':'防衛部隊';$('foeName').textContent=atk?'敵守備隊':'侵入部隊';$('log').textContent='敵が現れた！ コマンドを選ぼう！';$('actions').classList.remove('hidden');$('next').classList.add('hidden');$('next').textContent='次の戦闘へ ➜';$('next').onclick=advance;update()}function update(){$('stage').textContent=`第${b.index+1}戦 / ${b.count}`;$('allyHP').textContent=`HP ${b.ally}/100`;$('foeHP').textContent=`HP ${b.foe}/${b.max}`;$('allyBar').style.width=b.ally+'%';$('foeBar').style.width=b.foe/b.max*100+'%'}function act(type){if(!b)return;let damage=0,guard=false,msg='';if(type==='hit'){damage=17+Math.floor(Math.random()*10);msg=`攻撃！ ${damage}ダメージ。`}else if(type==='skill'){if(b.ally<=12){$('log').textContent='HPが足りない！';return}b.ally-=12;damage=32+Math.floor(Math.random()*14);msg=`✨ 必殺技！ ${damage}ダメージ！`}else{b.ally=Math.min(100,b.ally+13);guard=true;msg='🛡️ 防御してHPを13回復。'}b.foe=Math.max(0,b.foe-damage);if(!b.foe){$('log').textContent=msg+' 敵を撃破！';$('actions').classList.add('hidden');$('next').classList.remove('hidden')}else{let hit=Math.max(2,13+Math.floor(Math.random()*10)-(guard?10:0));b.ally=Math.max(0,b.ally-hit);$('log').textContent=msg+` 敵の反撃 ${hit}ダメージ。`;if(!b.ally){$('log').textContent+=' 敗北！';$('actions').classList.add('hidden');$('next').classList.remove('hidden');$('next').textContent='もう一度挑戦';$('next').onclick=()=>start(b.type)}}update()}function advance(){b.index++;if(b.index>=b.count){let type=b.type;wins++;money+=60;end();render();alert(`🏆 ${type==='attack'?'基地制圧！':'基地防衛成功！'}\n資金 +60`);return}b.ally=Math.min(100,b.ally+18);load()}function end(){b=null;$('battle').classList.add('hidden')}init();render();</script></html>
