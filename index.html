<!doctype html><html lang='ja'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'><title>秘密基地大戦 Ver.0.1</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#111;color:#eee}header{padding:14px 16px;background:#1b1b1b;border-bottom:1px solid #444}h1{font-size:20px;margin:0}.sub{font-size:12px;color:#aaa;margin-top:4px}.wrap{max-width:720px;margin:auto;padding:12px}.panel{background:#1b1b1b;border:1px solid #444;border-radius:12px;padding:12px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cell{aspect-ratio:1/1;border:1px solid #555;border-radius:8px;background:#262626;color:#eee;font-size:11px;padding:3px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}.cell.active{outline:3px solid #eee}.cell.done{opacity:.45}.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tool,button{border:0;border-radius:9px;padding:10px;background:#333;color:#fff;font-weight:700}.tool.sel{outline:2px solid #fff;background:#555}button.primary{background:#eee;color:#111;width:100%;font-size:16px}.stats{display:flex;gap:8px;flex-wrap:wrap}.badge{background:#2b2b2b;border-radius:99px;padding:6px 9px;font-size:12px}.log{height:150px;overflow:auto;background:#0c0c0c;border-radius:8px;padding:8px;font-size:12px;line-height:1.5}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.hidden{display:none}.hero{font-size:30px;text-align:center;margin:6px}.danger{background:#542525!important}.good{background:#28502e!important}.tiny{font-size:11px;color:#aaa}.title2{font-weight:800;margin-bottom:8px}
</style></head><body><header><h1>秘密基地大戦 <small>Ver.0.1</small></h1><div class='sub'>SECRET BASE WARS — 基地を作り、自分のヒーローで攻略せよ</div></header><main class='wrap'>
<section id='build' class='panel'><div class='title2'>① 秘密基地を建設</div><div class='tiny'>部屋を選び、マスをタップして配置。首領室は必須。</div><div class='tools' id='tools'></div><div style='height:10px'></div><div class='grid' id='grid'></div><div style='height:10px'></div><button class='primary' onclick='startRaid()'>🚨 ヒーロー侵入！</button></section>
<section id='battle' class='hidden'><div class='panel'><div class='title2'>② 基地攻略戦</div><div class='stats'><span class='badge' id='hp'></span><span class='badge' id='sp'></span><span class='badge' id='room'></span></div><div class='hero' id='hero'>🦸</div><div class='grid' id='battleGrid'></div><div class='actions'><button onclick='act("attack")'>⚔️ 通常攻撃</button><button onclick='act("special")'>💥 必殺技</button><button onclick='act("heal")'>✨ 回復</button><button onclick='retreat()'>🏃 撤退</button></div></div><div class='panel'><div class='title2'>戦況</div><div class='log' id='log'></div></div><button class='primary' onclick='resetGame()'>基地建設へ戻る</button></section>
</main><script>
const types=[['通路','⬜',0],['戦闘員室','🥷',25],['罠部屋','💣',30],['怪人室','👹',55],['回復室','💚',-25],['首領室','👿',90]];
let selected=0, base=Array(10).fill(null); let state={};
function init(){let t=document.getElementById('tools');types.forEach((x,i)=>{let b=document.createElement('button');b.className='tool'+(i===0?' sel':'');b.innerHTML=x[1]+' '+x[0];b.onclick=()=>{selected=i;document.querySelectorAll('.tool').forEach((e,j)=>e.classList.toggle('sel',j===i))};t.appendChild(b)});render();}
function render(){let g=document.getElementById('grid');g.innerHTML='';base.forEach((v,i)=>{let c=document.createElement('button');c.className='cell';c.innerHTML=v===null?`<span>${i+1}<br>未配置</span>`:`<span>${types[v][1]}<br>${types[v][0]}</span>`;c.onclick=()=>{base[i]=selected;render()};g.appendChild(c)});localStorage.setItem('sbw_base',JSON.stringify(base));}
function startRaid(){if(!base.includes(5)){alert('首領室を1つ配置してください！');return} if(base.filter(x=>x===5).length>1){alert('首領室は1つだけにしてください！');return} state={hp:120,max:120,sp:3,pos:0,enemyHP:0,ended:false};document.getElementById('build').classList.add('hidden');document.getElementById('battle').classList.remove('hidden');log('🚨 警報！ヒーローが秘密基地へ侵入した！');enterRoom();}
function enterRoom(){while(state.pos<base.length && base[state.pos]===null)state.pos++; if(state.pos>=base.length){win('基地を突破した！');return} let t=base[state.pos];state.enemyHP=Math.max(0,types[t][2]);log(`▶ ${state.pos+1}区画：${types[t][0]}へ突入！`);if(t===2){let d=18+Math.floor(Math.random()*18);state.hp-=d;log(`💣 罠が作動！ ${d}ダメージ！`);finishRoom();}else if(t===4){let h=25;state.hp=Math.min(state.max,state.hp+h);log(`💚 回復装置を奪取。HPが${h}回復！`);finishRoom();}else if(t===0){log('⬜ 通路を進む。');finishRoom();} update();renderBattle();}
function act(a){if(state.ended)return;let t=base[state.pos];if(state.enemyHP<=0)return;if(a==='heal'){if(state.sp<=0){log('SPがない！');return}state.sp--;let h=35;state.hp=Math.min(state.max,state.hp+h);log(`✨ 応急回復！ HP+${h}`);enemyTurn();return}let dmg=a==='special'?45+Math.floor(Math.random()*20):18+Math.floor(Math.random()*15);if(a==='special'){if(state.sp<=0){log('SPがない！');return}state.sp--;log(`💥 必殺技！ ${dmg}ダメージ！`)}else log(`⚔️ 攻撃！ ${dmg}ダメージ！`);state.enemyHP-=dmg;if(state.enemyHP<=0){log(`${types[t][1]} ${types[t][0]}を突破！`);finishRoom()}else enemyTurn();update();}
function enemyTurn(){let t=base[state.pos];let d=t===5?18+Math.floor(Math.random()*18):t===3?12+Math.floor(Math.random()*15):7+Math.floor(Math.random()*10);state.hp-=d;log(`${types[t][1]} 反撃！ ${d}ダメージ！`);if(state.hp<=0){state.hp=0;lose('ヒーロー全滅！ 秘密結社、防衛成功！')}update();}
function finishRoom(){if(base[state.pos]===5){win('👿 首領撃破！ 秘密基地壊滅！');return}state.pos++;setTimeout(()=>{if(!state.ended)enterRoom()},350)}
function update(){document.getElementById('hp').textContent=`HP ${state.hp}/${state.max}`;document.getElementById('sp').textContent=`SP ${state.sp}`;document.getElementById('room').textContent=`区画 ${Math.min(state.pos+1,10)}/10`;renderBattle()}
function renderBattle(){let g=document.getElementById('battleGrid');g.innerHTML='';base.forEach((v,i)=>{let c=document.createElement('div');c.className='cell'+(i===state.pos?' active':'')+(i<state.pos?' done':'');c.innerHTML=v===null?'—':`${types[v][1]}<br>${types[v][0]}`;g.appendChild(c)})}
function win(m){state.ended=true;log('🏆 '+m);document.getElementById('hero').textContent='🦸✨';update()}
function lose(m){state.ended=true;log('☠️ '+m);document.getElementById('hero').textContent='💀';update()}
function retreat(){if(confirm('攻略を中止しますか？'))lose('ヒーローは撤退した。秘密結社、防衛成功！')}
function log(s){let l=document.getElementById('log');l.innerHTML+=s+'<br>';l.scrollTop=l.scrollHeight}
function resetGame(){document.getElementById('battle').classList.add('hidden');document.getElementById('build').classList.remove('hidden');document.getElementById('log').innerHTML='';document.getElementById('hero').textContent='🦸'}
let saved=localStorage.getItem('sbw_base');if(saved)try{base=JSON.parse(saved)}catch(e){}init();
</script></body></html>
